<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparateur Prestataires - Complet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50">
    <div id="app" class="min-h-screen p-4 sm:p-8">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 mb-6">
                <div class="flex items-center justify-between flex-wrap gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-100 p-3 rounded-xl">
                            <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Comparateur Prestataires</h1>
                            <p class="text-gray-600 text-sm sm:text-base">Livraison Cabines Acoustiques</p>
                        </div>
                    </div>
                    <div class="px-4 py-2 bg-green-100 text-green-800 rounded-lg font-semibold text-sm">
                        ✓ 95 départements
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl shadow p-4">
                    <div class="text-sm text-gray-600">Prestataires</div>
                    <div class="text-2xl font-bold text-indigo-600" id="nbPrestataires">0</div>
                </div>
                <div class="bg-white rounded-xl shadow p-4">
                    <div class="text-sm text-gray-600">Départements</div>
                    <div class="text-2xl font-bold text-indigo-600">95</div>
                </div>
                <div class="bg-white rounded-xl shadow p-4">
                    <div class="text-sm text-gray-600">Types de cabines</div>
                    <div class="text-2xl font-bold text-indigo-600">3</div>
                </div>
            </div>

            <!-- Calculateur -->
            <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 mb-6">
                <div class="flex items-center gap-3 mb-6">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                    <h2 class="text-xl font-bold text-gray-900">Calculer votre livraison</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Département de livraison *</label>
                        <select id="departementLivraison" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <option value="">Sélectionner un département</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">ou saisir le code postal</label>
                        <input type="text" id="codePostal" placeholder="Ex: 33000" maxlength="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">Le département sera détecté automatiquement</p>
                    </div>
                </div>

                <!-- Cabines à livrer -->
                <div class="border-t pt-6 mb-6">
                    <h3 class="font-semibold text-gray-900 mb-4">Cabines à livrer</h3>
                    <div class="space-y-3">
                        <div class="flex items-center gap-4">
                            <div class="flex-1">
                                <label class="flex items-center gap-2">
                                    <input type="checkbox" id="checkSolo" onchange="updateQuantites()" class="w-5 h-5 text-indigo-600 rounded">
                                    <span class="font-medium">Solo</span>
                                </label>
                            </div>
                            <div class="w-24">
                                <input type="number" id="qteSolo" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center" onchange="updateQuantites()">
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex-1">
                                <label class="flex items-center gap-2">
                                    <input type="checkbox" id="checkDuo" onchange="updateQuantites()" class="w-5 h-5 text-indigo-600 rounded">
                                    <span class="font-medium">Duo</span>
                                </label>
                            </div>
                            <div class="w-24">
                                <input type="number" id="qteDuo" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center" onchange="updateQuantites()">
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex-1">
                                <label class="flex items-center gap-2">
                                    <input type="checkbox" id="checkQuattro" onchange="updateQuantites()" class="w-5 h-5 text-indigo-600 rounded">
                                    <span class="font-medium">Quattro</span>
                                </label>
                            </div>
                            <div class="w-24">
                                <input type="number" id="qteQuattro" min="0" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center" onchange="updateQuantites()">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tests rapides -->
                <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                    <div class="text-sm font-medium text-gray-700 mb-3">🚀 Tests rapides :</div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="testRapide('33', {Solo: 1})" class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 text-sm">
                            Bordeaux - 1 Solo
                        </button>
                        <button onclick="testRapide('69', {Duo: 2})" class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 text-sm">
                            Lyon - 2 Duo
                        </button>
                        <button onclick="testRapide('75', {Solo: 1, Duo: 1, Quattro: 1})" class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 text-sm">
                            Paris - Mix
                        </button>
                        <button onclick="testRapide('13', {Quattro: 3})" class="px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 text-sm">
                            Marseille - 3 Quattro
                        </button>
                    </div>
                </div>

                <button onclick="comparerPrestataires()" class="w-full flex items-center justify-center gap-2 px-6 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-all font-semibold text-lg shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    Comparer les prestataires
                </button>
            </div>

            <!-- Résultats -->
            <div id="resultatsPanel" class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 hidden">
                <h2 class="text-xl font-bold text-gray-900 mb-2">Résultats de comparaison</h2>
                <div id="recapCommande" class="mb-4"></div>
                <div id="economieInfo" class="mb-6"></div>
                <div id="resultatsListe" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        // TOUS LES DÉPARTEMENTS FRANÇAIS
        const departementsData = {
            "01": "Ain", "02": "Aisne", "03": "Allier", "04": "Alpes-de-Haute-Provence", "05": "Hautes-Alpes",
            "06": "Alpes-Maritimes", "07": "Ardèche", "08": "Ardennes", "09": "Ariège", "10": "Aube",
            "11": "Aude", "12": "Aveyron", "13": "Bouches-du-Rhône", "14": "Calvados", "15": "Cantal",
            "16": "Charente", "17": "Charente-Maritime", "18": "Cher", "19": "Corrèze", "21": "Côte-d'Or",
            "22": "Côtes-d'Armor", "23": "Creuse", "24": "Dordogne", "25": "Doubs", "26": "Drôme",
            "27": "Eure", "28": "Eure-et-Loir", "29": "Finistère", "30": "Gard", "31": "Haute-Garonne",
            "32": "Gers", "33": "Gironde", "34": "Hérault", "35": "Ille-et-Vilaine", "36": "Indre",
            "37": "Indre-et-Loire", "38": "Isère", "39": "Jura", "40": "Landes", "41": "Loir-et-Cher",
            "42": "Loire", "43": "Haute-Loire", "44": "Loire-Atlantique", "45": "Loiret", "46": "Lot",
            "47": "Lot-et-Garonne", "48": "Lozère", "49": "Maine-et-Loire", "50": "Manche", "51": "Marne",
            "52": "Haute-Marne", "53": "Mayenne", "54": "Meurthe-et-Moselle", "55": "Meuse", "56": "Morbihan",
            "57": "Moselle", "58": "Nièvre", "59": "Nord", "60": "Oise", "61": "Orne", "62": "Pas-de-Calais",
            "63": "Puy-de-Dôme", "64": "Pyrénées-Atlantiques", "65": "Hautes-Pyrénées", "66": "Pyrénées-Orientales",
            "67": "Bas-Rhin", "68": "Haut-Rhin", "69": "Rhône", "70": "Haute-Saône", "71": "Saône-et-Loire",
            "72": "Sarthe", "73": "Savoie", "74": "Haute-Savoie", "75": "Paris", "76": "Seine-Maritime",
            "77": "Seine-et-Marne", "78": "Yvelines", "79": "Deux-Sèvres", "80": "Somme", "81": "Tarn",
            "82": "Tarn-et-Garonne", "83": "Var", "84": "Vaucluse", "85": "Vendée", "86": "Vienne",
            "87": "Haute-Vienne", "88": "Vosges", "89": "Yonne", "90": "Territoire de Belfort", "91": "Essonne",
            "92": "Hauts-de-Seine", "93": "Seine-Saint-Denis", "94": "Val-de-Marne", "95": "Val-d'Oise"
        };

        // URL de ton endpoint Google Apps Script
        const API_URL = "https://script.google.com/macros/s/TON_ID_DE_SCRIPT/exec";

        let prestataireData = [];

        window.onload = function() {
            populateDepartements();
            setupCodePostalListener();
            fetchPrestataires();
        };

        async function fetchPrestataires() {
            try {
                const response = await fetch(API_URL);
                prestataireData = await response.json();
                updateStats();
            } catch (error) {
                console.error("Erreur de chargement des prestataires :", error);
                alert("Impossible de charger les données des prestataires. Vérifie la connexion ou l'URL de l'API.");
            }
        }

        function populateDepartements() {
            const select = document.getElementById('departementLivraison');
            Object.entries(departementsData).forEach(([code, nom]) => {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${code} - ${nom}`;
                select.appendChild(option);
            });
        }

        function setupCodePostalListener() {
            const input = document.getElementById('codePostal');
            input.addEventListener('input', function(e) {
                const cp = e.target.value;
                if (cp.length >= 2) {
                    const dept = cp.substring(0, 2);
                    if (departementsData[dept]) {
                        document.getElementById('departementLivraison').value = dept;
                    }
                }
            });
        }

        function updateStats() {
            const uniquePrestataires = [...new Set(prestataireData.map(p => p.prestataire))];
            document.getElementById('nbPrestataires').textContent = uniquePrestataires.length;
        }

        function updateQuantites() {
            const checkSolo = document.getElementById('checkSolo');
            const checkDuo = document.getElementById('checkDuo');
            const checkQuattro = document.getElementById('checkQuattro');

            if (checkSolo.checked && document.getElementById('qteSolo').value == 0) {
                document.getElementById('qteSolo').value = 1;
            }
            if (checkDuo.checked && document.getElementById('qteDuo').value == 0) {
                document.getElementById('qteDuo').value = 1;
            }
            if (checkQuattro.checked && document.getElementById('qteQuattro').value == 0) {
                document.getElementById('qteQuattro').value = 1;
            }
        }

        function testRapide(dept, quantites) {
            document.getElementById('departementLivraison').value = dept;

            document.getElementById('qteSolo').value = quantites.Solo || 0;
            document.getElementById('qteDuo').value = quantites.Duo || 0;
            document.getElementById('qteQuattro').value = quantites.Quattro || 0;

            document.getElementById('checkSolo').checked = quantites.Solo > 0;
            document.getElementById('checkDuo').checked = quantites.Duo > 0;
            document.getElementById('checkQuattro').checked = quantites.Quattro > 0;

            comparerPrestataires();
        }

        function comparerPrestataires() {
            const dept = document.getElementById('departementLivraison').value;
            const qteSolo = parseInt(document.getElementById('qteSolo').value) || 0;
            const qteDuo = parseInt(document.getElementById('qteDuo').value) || 0;
            const qteQuattro = parseInt(document.getElementById('qteQuattro').value) || 0;

            if (!dept) {
                alert("Veuillez sélectionner un département");
                return;
            }

            if (qteSolo === 0 && qteDuo === 0 && qteQuattro === 0) {
                alert("Veuillez sélectionner au moins une cabine");
                return;
            }

            // Regrouper par prestataire
            const parPrestataire = {};
            prestataireData.forEach(p => {
                const key = p.prestataire;
                if (!parPrestataire[key]) {
                    parPrestataire[key] = {
                        prestataire: p.prestataire,
                        departement: p.departement,
                        ville: p.ville,
                        zoneCouverture: p.zoneCouverture,
                        notes: p.notes,
                        tarifs: {}
                    };
                }
                parPrestataire[key].tarifs[p.typeCabine] = {
                    zone1: p.zone1Prix,
                    zone2: p.zone2Prix,
                    zone3: p.zone3Prix
                };
            });

            const results = [];

            Object.values(parPrestataire).forEach(presta => {
                const couverture = presta.zoneCouverture.includes(dept);

                if (!couverture) {
                    results.push({
                        ...presta,
                        couvertureOk: false,
                        prixTotal: null,
                        zone: null,
                        detail: []
                    });
                    return;
                }

                // Déterminer la zone
                let zone = 1;
                if (dept === presta.departement) {
                    zone = 1;
                } else {
                    const indexDept = presta.zoneCouverture.indexOf(dept);
                    zone = indexDept >= 0 && indexDept <= 2 ? 2 : 3;
                }

                // Calculer le prix total
                let prixTotal = 0;
                const detail = [];

                if (qteSolo > 0 && presta.tarifs.Solo) {
                    const prix = zone === 1 ? presta.tarifs.Solo.zone1 : zone === 2 ? presta.tarifs.Solo.zone2 : presta.tarifs.Solo.zone3;
                    prixTotal += prix * qteSolo;
                    detail.push({type: 'Solo', qte: qteSolo, prixUnit: prix, prixTotal: prix * qteSolo});
                }
                if (qteDuo > 0 && presta.tarifs.Duo) {
                    const prix = zone === 1 ? presta.tarifs.Duo.zone1 : zone === 2 ? presta.tarifs.Duo.zone2 : presta.tarifs.Duo.zone3;
                    prixTotal += prix * qteDuo;
                    detail.push({type: 'Duo', qte: qteDuo, prixUnit: prix, prixTotal: prix * qteDuo});
                }
                if (qteQuattro > 0 && presta.tarifs.Quattro) {
                    const prix = zone === 1 ? presta.tarifs.Quattro.zone1 : zone === 2 ? presta.tarifs.Quattro.zone2 : presta.tarifs.Quattro.zone3;
                    prixTotal += prix * qteQuattro;
                    detail.push({type: 'Quattro', qte: qteQuattro, prixUnit: prix, prixTotal: prix * qteQuattro});
                }

                results.push({
                    ...presta,
                    couvertureOk: true,
                    prixTotal: prixTotal,
                    zone: zone,
                    detail: detail
                });
            });

            const sorted = results.sort((a, b) => {
                if (a.couvertureOk && !b.couvertureOk) return -1;
                if (!a.couvertureOk && b.couvertureOk) return 1;
                if (a.couvertureOk && b.couvertureOk) return a.prixTotal - b.prixTotal;
                return 0;
            });

            afficherResultats(sorted, dept, {Solo: qteSolo, Duo: qteDuo, Quattro: qteQuattro});
        }

        function afficherResultats(results, dept, quantites) {
            const liste = document.getElementById('resultatsListe');
            const economieDiv = document.getElementById('economieInfo');
            const recapDiv = document.getElementById('recapCommande');
            liste.innerHTML = '';
            economieDiv.innerHTML = '';

            // Récap commande
            const recapItems = [];
            if (quantites.Solo > 0) recapItems.push(`${quantites.Solo} Solo`);
            if (quantites.Duo > 0) recapItems.push(`${quantites.Duo} Duo`);
            if (quantites.Quattro > 0) recapItems.push(`${quantites.Quattro} Quattro`);

            recapDiv.innerHTML = `
                <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-lg">
                    <div class="font-semibold text-indigo-900">📦 Commande : ${recapItems.join(', ')}</div>
                    <div class="text-sm text-indigo-700">📍 Livraison : ${dept} - ${departementsData[dept]}</div>
                </div>
            `;

            // Calcul économie
            const resultatsValides = results.filter(r => r.couvertureOk);
            if (resultatsValides.length >= 2) {
                const economie = resultatsValides[1].prixTotal - resultatsValides[0].prixTotal;
                economieDiv.innerHTML = `
                    <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-lg">
                        <div class="flex items-center gap-3">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <div>
                                <div class="font-bold text-green-900">💰 Économie : ${economie.toFixed(2)}€</div>
                                <div class="text-sm text-green-700">En choisissant ${resultatsValides[0].prestataire} plutôt que ${resultatsValides[1].prestataire}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            results.forEach((r, index) => {
                const div = document.createElement('div');
                const isBest = index === 0 && r.couvertureOk;
                const classes = isBest
                    ? 'bg-green-50 border-green-300 shadow-md'
                    : r.couvertureOk
                    ? 'bg-white border-gray-200'
                    : 'bg-gray-50 border-gray-300 opacity-60';

                div.className = `p-5 rounded-xl border-2 transition-all ${classes}`;

                let contenu = `
                    <div class="flex items-start justify-between flex-wrap gap-4">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-2 flex-wrap">
                                ${isBest ? '<span class="px-3 py-1 bg-green-600 text-white text-xs font-bold rounded-full whitespace-nowrap">🏆 MEILLEUR CHOIX</span>' : ''}
                                <h3 class="text-lg font-bold text-gray-900">${r.prestataire}</h3>
                                ${!r.couvertureOk ? '<span class="px-2 py-1 bg-orange-100 text-orange-700 text-xs font-semibold rounded whitespace-nowrap">Zone non couverte</span>' : ''}
                            </div>
                            <div class="text-sm text-gray-600 space-y-1">
                                <div>📍 Dépôt : ${r.ville} (${r.departement})</div>
                `;

                if (r.couvertureOk) {
                    contenu += `<div>🎯 Zone : ${r.zone}</div>`;
                    if (r.notes) contenu += `<div>⏱️ ${r.notes}</div>`;
                    contenu += `<div class="mt-2 font-medium">Détail :</div>`;
                    r.detail.forEach(d => {
                        contenu += `<div class="ml-2">• ${d.qte} × ${d.type} à ${d.prixUnit}€ = ${d.prixTotal}€</div>`;
                    });
                }

                contenu += `
                            </div>
                        </div>
                `;

                if (r.couvertureOk) {
                    contenu += `
                        <div class="text-right">
                            <div class="text-3xl sm:text-4xl font-bold ${isBest ? 'text-green-600' : 'text-indigo-600'}">${r.prixTotal.toFixed(2)}€</div>
                            <div class="text-sm text-gray-500">HT Total</div>
                        </div>
                    `;
                }

                contenu += `</div>`;

                div.innerHTML = contenu;
                liste.appendChild(div);
            });

            document.getElementById('resultatsPanel').classList.remove('hidden');
            document.getElementById('resultatsPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
